name: Public demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: home-huddle-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    env:
      SITE_BASE_PATH: /home-huddle/
      VITE_API_URL: ${{ vars.HOME_HUDDLE_API_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require the deployed Lambda URL
        run: test -n "$VITE_API_URL"
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
      - id: publish
        uses: actions/deploy-pages@v5
